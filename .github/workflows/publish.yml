name: Publish Cheongryong Talk

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/publish.yml
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pages: write
  id-token: write

concurrency:
  group: cheongryong-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'issues' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update seminar data from trusted issues
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/sync_issues.py
      - name: Commit changed data
        if: github.event_name == 'issues' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/talks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update seminar archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
